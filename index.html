<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- Viewport & High-DPI Mobile Display Optimization -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- Primary App Metadata -->
    <title>Zavoka Studio — 8K Neural Image & Product AI Suite</title>
    <meta name="description" content="Professional 8K AI super-resolution, photorealistic 3D product staging, calibrated HDR color grading, and lossless export engine." />
    
    <!-- PWA & Device OS Status Bar Theme Colors -->
    <meta name="theme-color" content="#090a0d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Zavoka" />
    
    <!-- Favicon & PWA Web App Manifest -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Performance Hints: Preconnect to Font & Neural Asset CDNs -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />

    <!-- High-Legibility Modern Typography Tokens -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>

  <body class="bg-[#090a0d] text-white antialiased selection:bg-[#00f2fe]/30 selection:text-white overflow-x-hidden">
    <!-- Fail-safe No-JavaScript Runtime Warning Container -->
    <noscript>
      <div style="background-color: #0b0d11; color: #00f2fe; padding: 24px; text-align: center; font-family: sans-serif; font-size: 14px; border-bottom: 1px solid #1e293b;">
        <strong>JavaScript Required:</strong> Zavoka Studio requires WebGL/WebGPU and JavaScript enabled to execute 8K neural image upscaling and 3D studio staging.
      </div>
    </noscript>

    <!-- React 18 Application Mount Target Container -->
    <div id="root"></div>

    <!-- Vite 5 Application Module Entrypoint -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
