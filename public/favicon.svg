<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background rounded squircle gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14171d"/>
      <stop offset="50%" stop-color="#0b0d11"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>

    <!-- Border highlight gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#9333ea" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Top facet of 'Z' - electric cyan -->
    <linearGradient id="zTopGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#70f8ff"/>
      <stop offset="100%" stop-color="#00c8e0"/>
    </linearGradient>

    <!-- Diagonal neural facet of 'Z' - high-tech electric violet into cyan -->
    <linearGradient id="zDiagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="35%" stop-color="#3b82f6"/>
      <stop offset="70%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>

    <!-- Bottom facet of 'Z' - vibrant magenta / violet -->
    <linearGradient id="zBotGrad" x1="0%" y1="50%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <!-- Ambient glow filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Subtle Neural Core Halo -->
  <circle cx="256" cy="256" r="160" fill="#00f2fe" opacity="0.06" filter="blur(32px)"/>
  <circle cx="256" cy="256" r="90" fill="#9333ea" opacity="0.08" filter="blur(24px)"/>

  <!-- Abstract Geometric Folded Origami "Z" Emblem -->
  <g filter="url(#neonGlow)">
    <!-- Top Horizontal Crystal Arm of the 'Z' -->
    <polygon points="128,152 384,152 328,212 128,212" fill="url(#zTopGrad)"/>

    <!-- Sharp Top-Right Origami Fold Corner -->
    <polygon points="384,152 384,212 328,212" fill="#00a3b8" opacity="0.85"/>

    <!-- Central Dynamic Diagonal Prism traversing down -->
    <polygon points="384,152 328,212 184,360 240,300" fill="url(#zDiagGrad)"/>

    <!-- Inner Core Refraction Slice -->
    <polygon points="256,220 336,220 220,340 176,340" fill="#60a5fa" opacity="0.35"/>

    <!-- Bottom Horizontal Crystal Arm of the 'Z' -->
    <polygon points="128,300 184,300 384,360 128,360" fill="url(#zBotGrad)"/>

    <!-- Bottom Left Origami Fold Corner -->
    <polygon points="128,300 184,300 128,360" fill="#6d28d9" opacity="0.9"/>

    <!-- Neural Apex Spark Accent Dot (Cyan 8K Optical Point) -->
    <circle cx="384" cy="152" r="6" fill="#ffffff"/>
    <circle cx="384" cy="152" r="12" fill="#00f2fe" opacity="0.6"/>
  </g>
</svg>
